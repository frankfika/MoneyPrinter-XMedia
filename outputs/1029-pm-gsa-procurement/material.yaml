summary: >-
  Anthropic 与 GSA 签 OneGov 协议：Claude 全线产品给政府 40% 折扣（Claude Enterprise /
  Claude for Government / Claude API），首次覆盖所有产品面，并延伸到州、地方、部落与属地政府。
  折扣预计为政府省 10 亿美元，且机构不绑定最低消费承诺、按实际用量付费。
  约 500 家联邦/州/地方政府机构已在用 Claude，Claude for Government 周活自 2 月涨约 8 倍，
  联邦文职机构用量一年涨约 20 倍。

