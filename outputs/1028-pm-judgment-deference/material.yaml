summary: >-
  Anthropic 2026-10-27 发布随机对照试验：50 名专业分析师用 Claude Code 做因果推断分析，
  每个决策点的 agent「倾向」由抛硬币随机决定，分析师不知情。结果 86% 的选择跟随 agent 倾向
  （无影响时应为 50%）；52% 的分析师事后仍称结论是「自己的判断」。

