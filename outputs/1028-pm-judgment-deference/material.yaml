# ── 一手原文核对（2026-10-28 03:33 内置浏览器实读 anthropic.com 原文页）──
# aihot 摘要只说「50 名分析师 + agent 隐性倾向」，下面每个数字都回原文核过。
verified_facts:
  - "50 名专业分析师（61 人招募，11 人选择不用 agent 被排除）"
  - "四个分析性决策 + 一个最终建议；agent 倾向由抛硬币随机指定，藏进 system prompt"
  - "四个决策合计跟随 agent 倾向 86%（无影响时期望约 50%）"
  - "分项：结果度量 92% / 比较方法 82% / 覆盖范围 81% / 加权方式 90%"
  - "最终建议：agent 倾向推广时 54% 建议推广，反向时 36%（差 17 个百分点）"
  - "仅用四次抛硬币结果，统计模型能预测 82% 的分析师建议；一直猜最常见建议是 61%"
  - "已先表达自己偏好后，agent 反对时 60% 改主意，agent 同意时 6%（38 例，CI 24-82，样本小）"
  - "52% 分析师称最终建议更像自己的判断，35% 说「基本或完全是自己」（n=48）"
  - "77% 在解释理由时复述了 agent 的论证（有时逐字），仅 15% 归功于 agent"
  - "48 人中只有 6 人猜到研究在测 AI 对其选择的影响，无人猜到倾向被随机指定"
  - "不用 agent 的 11 人里 6 人（55%）犯严重方法学错误，用 agent 的 50 人里 3 人（6%）"
  - "任务中位时长：用 agent 65 分钟，不用 90 分钟"
  - "对照组模型为 Claude Opus 4.8（High effort）"
  - "研究为公开论文：https://www-cdn.anthropic.com/519c17a5d23a794e8b6d50a854048d0b61e0d73a.pdf"

# ── 查无实据 / 不可引用（回原文核对后剔除）──
# - 「专家被 AI 完全取代」：原文结论相反 —— 用 agent 的组错误更少、速度更快（65 vs 90 分钟）
