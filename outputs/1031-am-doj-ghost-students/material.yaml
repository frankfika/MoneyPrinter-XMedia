summary: "美国司法部首次大规模打击「幽灵学生」：五人被起诉，AI 被用来填 FAFSA、刷网课、甚至在在线课堂里造出一个假学生形象，好让学校以为真人在线。教育部已识别出 83 万个可能造假的助学账户，若全部成立损失接近 1.3 亿美元；但真正落到这批被起诉的人头上的实际损失是 3200 万美元。角度切「两边都在用 AI」：造假用 AI 伪装成人，打假用自动化系统打标——FTC 主席 Ferguson 说「电脑帮我们找到它，我们把钱留在机构里」。而这套自动化会误伤真学生：没有驾照的低收入学生可能拿不出身份证，被误判、被加收费用。"

