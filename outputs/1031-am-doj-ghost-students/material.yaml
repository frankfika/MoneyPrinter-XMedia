verified_facts:
  - "标题：Thousands of \"ghost students\" use AI to steal millions in student loans, DOJ says"
  - "作者 Ashley Belanger（senior policy reporter，芝加哥）；页面署名 Oct 31, 2026 12:53 AM；栏目标签 \"5 arrests so far\""
  - "美国已起诉 five individuals（5 人），这是首次针对「幽灵学生」的广泛联邦打击（first broad federal crackdown）"
  - "DOJ 从「与肯尼亚国民有关的一个网络」查扣 超过 $750,000 的加密货币；数据分析帮助标记出疑似欺诈者"
  - "DOJ 国家欺诈执法部门助理总检察长 Colin M. McDonald 说这是 \"this is the first international seizure of its kind in Kenya\""
  - "McDonald 原话：\"It looks like the ghost student is actually completing the class.\"；\"Some even create the appearance of a fake student in an online classroom to trick schools into believing a real person is present. The goal is to keep the ghost student in school for as long as possible, semester after semester after semester.\""
  - "教育部（DOE）已 \"identified over 830,000 potentially fraudulent federal student aid accounts created by using this PII of US citizens\""
  - "DOJ：如果这些账户全是幽灵学生，总损失 close to $130 million"
  - "与这批被捕者直接相关的实际损失：\"more than $32 million in actual loss tied to these specific subjects\"，官方称 \"we believe that actual total is substantially higher\""
  - "个案一：一名被告用多个银行账户收取 超过 700 笔 欺诈退款，合计 approximately $1,439,548"
  - "个案二（Inside Higher Ed 报道）：一人收到 超过 $1 million 存款，关联 超过 300 个欺诈学生账户"
  - "造假流程：购买美国人的 PII（多针对高中毕业直接就业、从未上大学的人）→ 填 FAFSA 申请入学 → 助学金先打给学校 → 余额退到骗子控制的账户；几十名美国人开了账户做资金通道（money mules）"
  - "教育部与部分高校正在考虑加收费用（adding fees）来挡这类欺诈；辩方担心费用和在线身份核验会变成低收入学生的门槛"
  - "教育部次长 Nicholas Kent 指控拜登政府 \"turned off nearly every fraud detection measure\"；新规要求学生对着摄像头实时举政府签发的证件做在线身份核验"
  - "FTC 主席 Andrew Ferguson 原话：\"The computers help us find it, and we keep the money in the agency\"；称欺诈可以解决而不必额外配人手资源"
  - "自动系统给人打风险评级，标记 high risk 的申请直接拒绝；NCAN 顾问 MorraLee Keller 说 \"a lot of low-economic kids may not have secured, for example, a driver's license\"，可能因此卡在申请流程里，还可能多付费用"
  - "8 月教育部确认 6 月 29 日至 7 月 6 日的技术故障，导致欺诈评估结果没同步到部分 FAFSA 表格，发现后已重跑处理"

not_quotable:
  - "「AI 造假的规模是 83 万个账户」—— 原文的 83 万是 DOE 识别出的 \"potentially fraudulent\" 账户，且 1.3 亿是「若全部成立」的上限，不能说成已确认的造假规模"
  - "「幽灵学生已经骗走 1.3 亿美元」—— 1.3 亿是假设全部 83 万账户都是幽灵学生的推算上限；实际已确认的损失只有这批被捕者对应的 3200 万美元"
  - "「AI 让这些学生通过了验证」—— 原文说的是 AI 用来填表、完成课程、伪造在线课堂出席形象，身份核验环节被突破的具体手法原文没有讲"
  - "「拜登政府放任欺诈三年」—— Kent 的指控是「上任时几乎所有欺诈检测措施都被关掉了」，是当事方表态，不是经独立核实的结论"

