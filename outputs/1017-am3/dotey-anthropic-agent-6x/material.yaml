summary: |
  Anthropic 自己开了 AI agent:累计工作时长已是员工的 6 倍;
  技术岗新招里初级比例从 27% 砍到 9% — AI 已经在吃入门岗。
  80% 的 Claude 会话花在等员工回复;22% 的活是「管 AI」。
  工程师人均代码提交 5 倍,代码被删率与人写无差。
  1334 名员工 vs 1.1 万美国人对 AI 预期差距巨大:
  2030 年 AI 出诺贝尔级发现,员工 91% 信,美国人只 39%。
