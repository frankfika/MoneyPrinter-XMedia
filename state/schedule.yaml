# 短文助手 · 调度参数
#
# 2026-10-25 重写：三条 cron 的实际调度搬进文件，配置本体在 runtime（cron_read / cron_update）。
# 旧的 5-slot（am/noon/pm/eve/night）结构已作废 —— 实际跑的是 chuangzuo / pulse / super-bot 三条线。
#
# 2026-10-28 实测更正（chuangzuo_round_91）：**上一段写反了，以本段为准。**
#   `cron_read view=list` 实测：Mavis 侧三条 cron 全部 enabled=true / status=active
#   （super-bot 6560e820 · 09:00 / pulse 0dbbcbb9 · 4,10,16,22 / chuangzuo d5c0d018 · 3:30,15:30），
#   并且 **2026-10-28 10:00 的 pulse_round_77 就是 Mavis 侧 cron 跑的**（走内置浏览器，已登录 @FrankFika）。
#   → **真正在跑的是 Mavis 侧 cron，`cron_id` 字段是有效的，不是残留。**
#
# 2026-10-29 执行（Frank 「继续执行啊」后落地）：
#   → **DSH launchd 那套已卸载**：`com.fangchen.shortbot.{pulse,chuangzuo,super-bot}` 三条
#     `launchctl bootout` + `launchctl disable`（持久化，重启后仍不加载）。
#     理由：pulse/chuangzuo 两个 job 累计 19 次触发全部 `NOT_LOGGED_IN` 秒退（0 次真跑）；
#     super-bot 那个 job **不是死的** —— 它不碰 X，照跑不误，2026-10-28 与 10-29 09:00
#     **各写了一份日报**（双 runner 同点投递，状态：两份并存作为事故证据，未删改）。
#   → **保留** `com.fangchen.shortbot.browser`（xb.py 那条链路的 Chrome 实例）
#     与 `com.fangchen.shortbot.restartdsh`（DSH desktop profile 的 host 重启，与 shortbot 调度无关）。
#     这两个**不是调度器**，留着不影响单 runner。
#   → 三条线**全部**由 Mavis runtime cron 覆盖，卸载 launchd 不丢任何档口。
#   → 卸载后仍保留的 plist 文件未删除，`launchctl enable` + `load` 即可回滚。
#
#   安装器：scripts/install-cron.sh    单轮执行器：scripts/run-round.sh
#   prompt 唯一事实源：docs/cron-prompts/*.md（run-round.sh 从围栏块抽取，不维护副本）

# ══════════════════════════════════════════════════════════════
# 2026-10-31 权威口径（本地化 + 无视觉）：调度器 = 本机常驻 scripts/scheduler.sh + codex exec
#   scheduler.sh 每 30s 醒一次按档口 fire scripts/run-round.sh（pid 文件 logs/local/.scheduler.pid，
#   停止：touch logs/local/.scheduler-stop 或 kill 该 pid；启动：nohup bash scripts/scheduler.sh &）
#   chuangzuo = X 创作 30 分 × 偶数时（每 2h，:30 错开 pulse 的 :00）
#   xhs       = 小红书  37 9,12,16,20 候选档口（≤2 条/天，间隔 ≥10h）
#   pulse     = X 互动  0 4,10,16,22（单轮 ≤3 动作）
#   super-bot = 日报    0 9（只读）
#   单轮执行器：scripts/run-round.sh <line>（codex exec -s danger-full-access，prompt 抽自
#   docs/cron-prompts/<line>.md 第一个围栏块；日志 logs/local/）
#   浏览器唯一通道 = xb.py（专用 Chrome，CDP 9222，DOM 无视觉）；
#   Codex 内置浏览器（组织策略禁用）与 AX（视觉通道）已废止。
#   （launchd 方案保留在 scripts/install-launchd.sh，备选；机器重启后 scheduler.sh 需重拉，
#    要开机自启就换 launchd 那条。）
# 下方 executor/crons 块里的 Mavis/Codex cron_id 均为历史存档，不再生效。
# ══════════════════════════════════════════════════════════════

timezone: Asia/Shanghai

# ─── 实际 cron ───
executor:
  launcher: launchd                       # 2026-10-31 起：本机 launchd 为唯一调度器
  command: 'scripts/run-round.sh <line>（codex exec）'
  session: new
  runner: scripts/run-round.sh
  per_line_lock: true                  # 同一条线不并发；跨线可并行
  retired_launchd: []                  # 2026-10-31 四条线已由 scripts/install-launchd.sh 重新装回
  kept_launchd_not_schedulers:        # 不是调度器，留着无害
    - com.fangchen.shortbot.browser    # xb.py 链路的 Chrome 实例（--user-data-dir=.shortbot-browser-profile）
    - com.fangchen.shortbot.restartdsh # DSH desktop profile 的 host 重启，与 shortbot 调度无关

crons:
  super-bot:
    cron_id: "super-bot-09-00"   # Codex automation（2026-10-30；旧 Mavis id 6560e820 已作废）
    plist_label: com.fangchen.shortbot.super-bot
    schedule: "0 9 * * *"
    label: 每日 09:00 +08:00 汇报
    session: new          # ★ 每轮独立 session，不要共用
    skill: skills/super-bot/SKILL.md

  pulse:
    cron_id: "x-pulse-6"   # Codex automation（2026-10-30；旧 Mavis id 0dbbcbb9 已作废）
    plist_label: com.fangchen.shortbot.pulse
    schedule: "0 4,10,16,22 * * *"
    label: 每 6 小时一轮互动（4 轮/天）   # ⚠️ 旧文案写「每 4 小时」是错的 —— 04/10/16/22 是每 6 小时
    session: new          # ★ 每轮独立 session
    skill: skills/x-engagement-pulse/SKILL.md

  chuangzuo:
    cron_id: "pipeline-12"   # Codex automation（2026-10-30；旧 Mavis id d5c0d018 已作废）
    plist_label: com.fangchen.shortbot.chuangzuo
    schedule: "30 3,9,15,21 * * *"
    label: 每 6 小时一轮创作（4 轮/天，2026-10-30 Frank「多发布」）
    session: new          # ★ 每轮独立 session
    skill: skills/README.md

# ─── 小红书发布线（2026-10-29 17:11 Frank 授权代点发布）───
# 与 X 线完全分开：X 走 chuangzuo 定时创作，小红书走**分散发布**。
#
# 为什么分散而不是集中一个固定时段：
#   账号被封的原因为「利用 AI 托管进行发文/互动」。**固定时段的连发是机器特征最重的形态**
#   —— 每天同一分钟发布、每天同样条数，正是机器人的指纹。分散 + 每天条数浮动 = 更接近真人节奏。
#   这是「操作层面降风险」的核心手段（文案侧只需 AI 味清零）。
#
# 档口设计（4 个候选档口，每档覆盖不同时段）：
#   09:37 / 12:23 / 16:41 / 20:18 —— 分钟刻意不规则（非 00/30），避免整点连发的机器指纹
#   每天只从中**随机挑 1~2 个**执行 → 实际发布时刻每天不同、条数每天不同
#
# 落地方式：一条 Mavis runtime cron（session.mode=new），prompt 内做随机选择 + 状态门控。
#   每次触发先读 `private/account-safety.yaml#xhs` 与 `state/xhs-publish-state.json`，
#   决定「这一轮发不发、发哪一篇」，不满足条件就老实记「本轮零发布 + 原因」。
xhs:
  cron_id: "automation"          # Codex automation（2026-10-30 创建，显示名「小红书发布线·分散档口」）
  schedule_candidates: ["37 9 * * *", "37 12 * * *", "37 16 * * *", "37 20 * * *"]
  label: 每天 4 个候选档口，随机挑 1~2 个执行
  session: new
  skill: skills/publisher-xhs/SKILL.md
  write_skill: skills/post-writer-xhs/SKILL.md
  posts_per_day_max: 2           # 2026-10-30 Frank「多发布」自 1 上调（首篇已过审的假设下；若审核有异常，回退 1）
  posts_per_day_min: 1
  min_gap_hours: 10              # 同一天两条之间至少隔 10 小时（2026-10-30 自 12 下调；9:37+20:37 档可支撑 2 条/天）
  draft_pool_required: true      # 必须先有 xhs.txt + ≥2 张真截图，才轮到发布
  ai_taste_gate: "humanize.py scan soft_score == 0 且 prepublish.py passed"
  confirm_card_before_publish: true   # 每次发布前出确认卡（讲清站点/账号/标题/正文/图片/可见性）
  state_file: state/xhs-publish-state.json
  notes: >-
    2026-10-29 17:12 首篇已发布（note_id 6ae30e1b0000000033012638，审核中）。
    自动化可行性待探测验证：cron session 里内置浏览器的小红书登录态是否保持
    （探测任务写 state/memory/xhs-probe.md）。验证通过前不启用自动发。

# ─── 频率硬上限（Frank 2026-10-21 降频，最高优先级）───
pulse_actions_per_round_max: 3
pulse_inbound_reply_max: 1
pulse_outbound_reply_max: 0        # Frank 2026-10-27「少评论，多干发原创」→ outbound reply 配额归零（旧值 1 已作废）
pulse_outbound_like_max: 2
pulse_original_post_max: 0        # pulse 不发原创，chuangzuo 独占

chuangzuo_original_post_max: 1    # 每轮最多 1 条原创
chuangzuo_original_post_min_gap_hours: 2    # → 最多 12 条/天，Frank 2026-10-31「每 2h 一发」（自 6 再下调；10-30 是 6h，10-27 是 12h）
# 互动差（likes ≤ 2）不再否决发送，只作为「换选题方向」的信号 → 见 publish_gates.likes_signal

# 原创间隔下限。真实节奏由上方的 min_gap_hours + 前置判据（likes 闸门）决定，
# 这个 30 min 只是硬地板，不是目标。
cooldown_between_posts_min: 30

# ─── 前置判据（发之前必做，不是可选项）───
publish_gates:
  - id: frank_recent_original_post
    desc: >-
      Frank 自己在 min_gap_hours(2) 内发过**原创帖** → 本轮零发送（**硬否决**）。
      **只数根帖（原创），reply 不计入。**
    check: >-
      search?q=from:FrankFika 取首条 post_id + snowflake 反解发帖时刻，再与
      account-safety.yaml#x.last_published_at 比对。
      ⚠️ 不要用 with_replies 页的顶部 —— 它对 quote RT 的排序会把手动帖排到别的帖后面去
      （2026-10-28 pulse_round_79 实测：19:49 的手动帖在 with_replies 上排不到顶部）。
    note: >-
      2026-10-27 修正口径。旧口径把 reply 也算成「发过帖」，而 pulse 一天跑 4 轮
      (4/10/16/22)、chuangzuo 一天 2 轮 (3:30/15:30)：只要 pulse 回一条 reply，
      12h 窗口就被占掉，两个档口**双双 100% 被自己的回复饿死**
      （实测 22:08 的 reply → 3:30 档直接被否）。
      reply 的节奏归 pulse 自己管（配额表 ≤3 动作/轮、reply 间隔 ≥8min），
      原创的 12h 间隔只管原创。两者本来就不该互相锁死。
  - id: last_text_action_spacing
    desc: 距上一次**任何**公开文字动作（reply / 原创）≥ 30 min → 本轮不发，等下一个窗口
    check: account-safety.yaml#x.last_published_at / last_outbound_reply_at / last_inbound_reply_at
    action_when_hit: 顺延，不是零发送（留到下一个 12h 窗口）
  - id: likes_signal
    desc: >-
      上一条原创 2h 后 likes 仍 ≤ 2 → **换选题方向**（不是否决发送）。
      2026-10-27 Frank「多干发原创」：这条闸门原本是硬否决，连否 3 轮（86/87/88），
      结果 40 小时零原创。互动差是**选题**问题，不是**发不发**问题 ——
      硬否决会让账号彻底停更，正好和 Frank 要的方向相反。
    check: 'query kind=dom 打 [data-testid="like"] 读 aria-label'
    action_when_hit: 记录信号 + 换一个**角度/领域**再发，不要在同一簇里重复

# ─── 输出 ───
output_root: /Users/fangchen/Documents/短文助手/outputs
output_naming: <YYYY-MM-DD>-<slot>
output_files:
  - material.yaml
  - x.txt
  - xhs.txt
  - screenshots/*.png

memory_root: /Users/fangchen/Documents/短文助手/state/memory
memory_keep_rounds: 30           # 主文件只留末 30 段，更早的进 archive/

# ─── 上下文纪律 ───
# 每轮该读什么，不要全量 cat
context_reads:
  rules: skills/x-engagement-pulse/SKILL.md
  dedup: state/index.json          # 不是 seen-posts.json
  rules_yaml:
    - state/forbidden.yaml
    - state/style-x.yaml
    - state/watchlist.yaml
    - private/account-safety.yaml
  rounds:
    - python3 scripts/tail-rounds.py state/memory/pulse.md --rounds 3
    - python3 scripts/tail-rounds.py state/memory/chuangzuo.md --rounds 2
  budget_per_round_kb: 89         # 旧方案全量 cat ≈ 1276 KB

# ─── 已废弃（2026-10-25 移除）───
# - 5-slot cron_slots（am/noon/pm/eve/night）→ 实际是三条独立 cron
# - scripts/run-all-slots.sh / scripts/scan-slot.sh（lite 模式）
#   schedule.yaml 原文自己写明：mmx 是通用 web 搜索，不支持 from: / site:x.com，
#   X 反爬让多数 x.com URL 不出现在搜索结果里 → scan-slot.sh 在多数 slot 会 found 0 candidate(s)。
#   留着只会让 agent 以为 lite 是一条可行路径。
# - scripts/launchd/*.plist（已迁移到 runtime cron，launchctl list 里已无 job）
